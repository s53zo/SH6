<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CQ API Browser Smoke</title>
  <style>
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      margin: 1.25rem;
      color: #0f172a;
      background: #f8fafc;
    }
    .status {
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    .status-pass { color: #166534; }
    .status-fail { color: #b91c1c; }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      border-radius: 0.5rem;
      padding: 0.75rem;
      max-height: 70vh;
      overflow: auto;
    }
  </style>
</head>
<body>
  <h1>CQ API Browser Smoke</h1>
  <p>Scenario: `CQWW` / `cw` / year `2024` / callsign `S53ZO` via SH6 proxy helper; operator-only score rows must not be used as callsign score evidence.</p>
  <div id="status" class="status">RUNNING</div>
  <pre id="result">Waiting for test result...</pre>

  <script>
    (() => {
      const nativeFetch = window.fetch.bind(window);
      const jsonResponse = (payload) => new Response(JSON.stringify(payload), {
        status: 200,
        headers: { 'Content-Type': 'application/json' }
      });
      window.fetch = (input, options) => {
        const url = String(input instanceof Request ? input.url : input || '');
        if (!url.startsWith('https://azure.s53m.com/cors/cqapi/cqww/')) {
          return nativeFetch(input, options);
        }
        const endpoint = decodeURIComponent(url.split('/cqww/')[1] || '');
        if (endpoint === 'geolist') {
          return Promise.resolve(jsonResponse({ status: 200, S5: 'Slovenia', EUR: 'Europe', WORLD: 'World' }));
        }
        if (endpoint === 'catlist') {
          return Promise.resolve(jsonResponse({ status: 200, data: [{ category: 'AH ALL', description: 'Assisted high power' }] }));
        }
        if (endpoint === 'score/cw/2024/S53ZO') {
          return Promise.resolve(jsonResponse({
            status: 200,
            data: [{ yr: 2024, callsign: 'S50A', operators: 'S53ZO S50A', cat: 'AH ALL', score: 1234567, q: 2200, cty: 'S5' }]
          }));
        }
        if (endpoint === 'score/cw/*/S53ZO') {
          return Promise.resolve(jsonResponse({
            status: 200,
            data: [
              { yr: 2023, callsign: 'S53ZO', operators: 'S53ZO', cat: 'AH ALL', score: 1100000, q: 2100, cty: 'S5' },
              { yr: 2022, callsign: 'S53ZO', operators: 'S53ZO', cat: 'AH ALL', score: 980000, q: 1950, cty: 'S5' }
            ]
          }));
        }
        if (endpoint === 'raw/cw/callsign/S53ZO') {
          return Promise.resolve(jsonResponse({ status: 200, data: [] }));
        }
        if (endpoint.startsWith('record/cw/')) {
          const [, , category = '*', geo = 'WORLD'] = endpoint.split('/');
          return Promise.resolve(jsonResponse({
            status: 200,
            category,
            geo,
            year: 2023,
            call: 'S50A',
            score: 1500000,
            qsos: 2400,
            operators: 'S50A'
          }));
        }
        return Promise.resolve(jsonResponse({ status: 404, data: [] }));
      };
    })();
  </script>
  <script src="../cq-api-enrichment.js"></script>
  <script>
    (async () => {
      const statusEl = document.getElementById('status');
      const resultEl = document.getElementById('result');
      const request = {
        contestId: 'CQWW',
        mode: 'cw',
        callsign: 'S53ZO',
        year: '2024',
        categories: ['AH ALL', '*'],
        geos: ['S5', 'EUR', 'WORLD']
      };

      function setResult(ok, payload) {
        statusEl.textContent = ok ? 'PASS' : 'FAIL';
        statusEl.className = `status ${ok ? 'status-pass' : 'status-fail'}`;
        resultEl.textContent = JSON.stringify(payload, null, 2);
      }

      try {
        if (!window.SH6CqApi || typeof window.SH6CqApi.createClient !== 'function') {
          throw new Error('window.SH6CqApi.createClient is unavailable');
        }
        const client = window.SH6CqApi.createClient({
          proxyBase: 'https://azure.s53m.com/cors/cqapi',
          useProxy: true,
          useDirect: false,
          timeoutMs: 9000,
          maxAttempts: 3,
          retryBackoffMs: 220,
          debug: true
        });
        const startedAt = Date.now();
        const result = await client.enrich(request);
        const elapsedMs = Date.now() - startedAt;

        const normalizeCall = (value) => String(value || '').trim().toUpperCase();
        const rawCurrentRows = Array.isArray(result?.debugPayload?.responses?.currentScore?.data)
          ? result.debugPayload.responses.currentScore.data
          : [];
        const operatorOnlyCurrentRows = rawCurrentRows.filter((row) => {
          const rowCall = normalizeCall(row?.callsign || row?.call);
          const operators = String(row?.operators || '').split(/\s+/).map(normalizeCall);
          return rowCall !== normalizeCall(request.callsign) && operators.includes(normalizeCall(request.callsign));
        });

        const checks = [];
        if (!result || result.ok !== true) checks.push('Result is not ok=true');
        if (result?.contestId !== 'CQWW') checks.push('Unexpected contestId');
        if (result?.currentScore !== null) checks.push('Operator-only current score should not be used as callsign score evidence');
        if (!operatorOnlyCurrentRows.length) checks.push('CQ API fixture did not expose operator-only current score row');
        if (!Array.isArray(result?.history) || result.history.length === 0) checks.push('Missing history rows');
        if (!String(result?.source || '').includes('azure.s53m.com/cors/cqapi')) checks.push('Unexpected source URL');
        const mainRes = await fetch('../main.js', { cache: 'no-store' });
        if (!mainRes.ok) {
          checks.push(`Unable to read main.js (${mainRes.status})`);
        } else {
          const mainSource = await mainRes.text();
          if (!mainSource.includes('function renderCompetitorCoach')) checks.push('Competitor coach renderer missing in main.js');
          if (!mainSource.includes('function renderSpots(')) checks.push('Spots renderer missing in main.js');
          if (!mainSource.includes('chart-mode-btn')) checks.push('Chart metric mode controls missing in main.js');
          if (!mainSource.includes("{ id: 'export', title: 'EXPORT PDF, HTML, CBR' }")) checks.push('Export menu label mismatch');
          if (!mainSource.includes("const COMPARE_WORKSPACE_MODULE_URL = './modules/compare/workspace-ui.js?v=6.3.24';")) {
            checks.push('Compare workspace module import missing in main.js');
          }
          if (!mainSource.includes("const ARCHIVE_CLIENT_MODULE_URL = './modules/archive/client.js?v=6.3.24';")) {
            checks.push('Archive client module import missing in main.js');
          }
          if (!mainSource.includes('function loadArchiveClientModule()')) {
            checks.push('Archive client loader missing in main.js');
          }
        }
        const compareModuleRes = await fetch('../modules/compare/workspace-ui.js', { cache: 'no-store' });
        if (!compareModuleRes.ok) {
          checks.push(`Unable to read compare workspace module (${compareModuleRes.status})`);
        } else {
          const compareModuleSource = await compareModuleRes.text();
          if (!compareModuleSource.includes('function renderCompareWorkspaceToolbar')) {
            checks.push('Compare workspace toolbar renderer missing in workspace-ui module');
          }
        }
        const archiveModuleRes = await fetch('../modules/archive/client.js', { cache: 'no-store' });
        if (!archiveModuleRes.ok) {
          checks.push(`Unable to read archive client module (${archiveModuleRes.status})`);
        } else {
          const archiveModuleSource = await archiveModuleRes.text();
          if (!archiveModuleSource.includes('export function createArchiveClient')) {
            checks.push('Archive client factory missing in archive module');
          }
          if (!archiveModuleSource.includes('async function queryRowsByCallsign')) {
            checks.push('Archive query helper missing in archive module');
          }
          if (!archiveModuleSource.includes('async function fetchArchiveLogText')) {
            checks.push('Archive log fetch helper missing in archive module');
          }
        }
        const styleRes = await fetch('../style.css', { cache: 'no-store' });
        if (!styleRes.ok) {
          checks.push(`Unable to read style.css (${styleRes.status})`);
        } else {
          const styleSource = await styleRes.text();
          if (!styleSource.includes('.compare-workspace')) checks.push('Compare workspace styles missing in style.css');
          if (!styleSource.includes('.chart-mode-btn')) checks.push('Chart mode button styles missing in style.css');
          if (!styleSource.includes('.coach-severity-badge')) checks.push('Coach severity badge styles missing in style.css');
        }

        if (checks.length) {
          setResult(false, {
            checksFailed: checks,
            elapsedMs,
            request,
            result
          });
          return;
        }

        setResult(true, {
          elapsedMs,
          request,
          source: result.source,
          currentScore: result.currentScore,
          operatorOnlyCurrentScoreRows: operatorOnlyCurrentRows.slice(0, 3).map((row) => ({
            callsign: row.callsign || row.call || '',
            operators: row.operators || '',
            year: row.year,
            score: row.score,
            qsos: row.qsos,
            category: row.category
          })),
          historyTop3: result.history.slice(0, 3).map((row) => ({
            year: row.year,
            score: row.score,
            qsos: row.qsos
          })),
          record: result.record ? {
            callsign: result.record.callsign,
            year: result.record.year,
            score: result.record.score
          } : null,
          uiChecks: [
            'renderCompetitorCoach present',
            'renderSpots present',
            'compare workspace module import present',
            'renderCompareWorkspaceToolbar present in workspace-ui module',
            'archive client module import present',
            'archive client helpers present',
            'chart-mode-btn controls present',
            'compare-workspace styles present',
            'coach-severity-badge styles present',
            'EXPORT PDF, HTML, CBR menu label present'
          ]
        });
      } catch (err) {
        setResult(false, {
          error: err && err.message ? err.message : String(err),
          request
        });
      }
    })();
  </script>
</body>
</html>
